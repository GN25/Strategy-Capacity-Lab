[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-capacity-lab"
version = "0.1.0"
description = "A fixed-strategy capital, market-impact and participation-budget study."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "requests>=2.31", "matplotlib>=3.8", "Pillow>=10", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strategy-capacity = "strategy_capacity.study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
